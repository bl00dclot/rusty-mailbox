[package]
name = "rusty-mailbox"
version = "0.1.5"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/bl00dclot/rusty-mailbox"
readme = "README.md"
keywords = ["email", "smtp", "outbox", "queue", "dkim"]
categories = ["email", "asynchronous", "network-programming"]
description = "Durable SQLite-backed outbox that delivers lettre messages over SMTP in the background"

[dependencies]
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "webpki-roots", "aws-lc-rs"] }
# Unreleased mail-auth main at da47a34eb6 (v0.15.1 plus #65, an optional rustls-platform-verifier):
# keeps rustls-platform-verifier and rustls-native-certs out of the tree. Move to crates.io once released.
mail-auth = { version = "0.16.0", git = "https://github.com/stalwartlabs/mail-auth", rev = "da47a34eb6cd31c787c2b4d9b2f449245cea9253", default-features = false, features = ["aws-lc-rs"] }
rustls-pki-types = "1.16"
hickory-resolver = "0.26.3"
rusqlite = { version = "0.43", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["macros", "sync", "time", "net", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
webpki-roots = "1.0.12"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "signal"] }
